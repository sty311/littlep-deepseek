name: Bug report
description: Report a reproducible issue with anonymous synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not attach firmware, vendor code, API keys, serials, private scans or full logs.
  - type: textarea
    id: versions
    attributes:
      label: Model, OS, DTB, SKU and project version (no serial)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and anonymous error summary
    validations:
      required: true
